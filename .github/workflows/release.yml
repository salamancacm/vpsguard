name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -race

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X github.com/salamancacm/vpsguard/cmd.Version=${GITHUB_REF_NAME}" \
              -o "dist/vpsguard-linux-$arch" .
          done

      - name: Install nfpm
        run: |
          NFPM_VERSION=$(curl -sSfL https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep '"tag_name"' | head -1 | cut -d '"' -f4 | sed 's/^v//')
          curl -sSfL -o nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i nfpm.deb

      - name: Build .deb/.rpm packages
        run: |
          for arch in amd64 arm64; do
            for pkg in deb rpm; do
              VERSION="${GITHUB_REF_NAME#v}" ARCH="$arch" nfpm package --config nfpm.yaml --packager "$pkg" --target dist/
            done
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/salamancacm/vpsguard:${{ github.ref_name }}
            ghcr.io/salamancacm/vpsguard:latest
